name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ytdlp_asset: yt-dlp_linux
            ytdlp_name: yt-dlp-x86_64-unknown-linux-gnu
            ffmpeg_skip: true
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ytdlp_asset: yt-dlp.exe
            ytdlp_name: yt-dlp-x86_64-pc-windows-msvc.exe
            ffmpeg_skip: false
          - platform: macos-latest
            target: aarch64-apple-darwin
            ytdlp_asset: yt-dlp_macos
            ytdlp_name: yt-dlp-aarch64-apple-darwin
            ffmpeg_skip: false

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: demos/yt-extractor/lavescar-ytdl/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: demos/yt-extractor/lavescar-ytdl/src-tauri

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Download yt-dlp sidecar binary
        shell: bash
        working-directory: demos/yt-extractor/lavescar-ytdl/src-tauri/binaries
        run: |
          curl -L -o "${{ matrix.ytdlp_name }}" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp_asset }}"
          if [ "${{ matrix.platform }}" != "windows-latest" ]; then
            chmod +x "${{ matrix.ytdlp_name }}"
          fi

      - name: Install frontend deps
        working-directory: demos/yt-extractor/lavescar-ytdl
        run: npm ci

      - name: Build Tauri bundle
        working-directory: demos/yt-extractor/lavescar-ytdl
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lavescar-ytdl-${{ matrix.target }}
          path: |
            demos/yt-extractor/lavescar-ytdl/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
