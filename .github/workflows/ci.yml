name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: demos/yt-extractor/lavescar-ytdl

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demos/yt-extractor/lavescar-ytdl/src-tauri
      - name: cargo fmt
        working-directory: demos/yt-extractor/lavescar-ytdl/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: demos/yt-extractor/lavescar-ytdl/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: demos/yt-extractor/lavescar-ytdl/src-tauri
        run: cargo test --all

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: demos/yt-extractor/lavescar-ytdl/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
